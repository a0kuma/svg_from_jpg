<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG 區塊點選複製器</title>
<style>
  :root { --bg:#0f1216; --panel:#151a21; --line:#2a323d; --fg:#e6edf3; --mut:#8b98a8;
          --accent:#4dd0e1; --hot:#ff5d73; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:14px/1.4 system-ui,"Noto Sans TC",sans-serif; overflow:hidden; }
  #bar { height:52px; display:flex; align-items:center; gap:14px; padding:0 16px;
         background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:5; }
  #bar h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  #bar .sp { flex:1; }
  .btn { background:#1e2630; color:var(--fg); border:1px solid var(--line); border-radius:8px;
         padding:7px 12px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--accent); }
  .btn.file { position:relative; overflow:hidden; }
  .btn.file input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .hint { color:var(--mut); font-size:12px; }
  #xpos { min-width:92px; text-align:right; font-variant-numeric:tabular-nums; }
  #stage { position:absolute; top:52px; left:0; right:0; bottom:0; display:flex; }
  .side { position:relative; flex:1 1 50%; overflow:hidden; }
  .side + .side { border-left:1px solid var(--line); }
  .tag { position:absolute; top:10px; left:12px; z-index:4; color:var(--mut);
         font-size:12px; background:rgba(15,18,22,.6); padding:3px 8px; border-radius:6px;
         pointer-events:none; }
  .wrap { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  .wrap svg { display:block; position:absolute; top:0; left:0; z-index:0; }
  .wrap canvas { position:absolute; top:0; left:0; z-index:2; }
  .vshade { position:absolute; top:0; height:100%; display:none; pointer-events:none; z-index:1; }
  #cv { cursor:crosshair; }
  .side.panning, .side.panning #cv { cursor:grabbing; }
  #right .wrap { background:#0b0e12; box-shadow:inset 0 0 0 1px var(--line); }
  #flyer { position:fixed; inset:0; z-index:9999; pointer-events:none; }
  #drop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:var(--mut); text-align:center; z-index:3; }
  #drop b { color:var(--fg); }
  #stage.dragover #drop { color:var(--accent); }
  /* portrait (e.g. phones): stack the two panels top/bottom instead of left/right */
  @media (orientation: portrait) {
    #stage { flex-direction:column; }
    .side + .side { border-left:none; border-top:1px solid var(--line); }
  }
</style>

<div id="bar">
  <h1>SVG 區塊點選複製器</h1>
  <label class="btn file">上傳 SVG<input id="fin" type="file" accept=".svg,image/svg+xml"></label>
  <button class="btn" id="fit">重設視圖</button>
  <button class="btn" id="clrpt">清除點</button>
  <button class="btn" id="clrcp">清空右側</button>
  <button class="btn" id="shade">套用垂直色帶</button>
  <button class="btn" id="horizon">Horizon</button>
  <div class="hint" id="xpos">x: --%</div>
  <span class="sp"></span>
  <span class="hint">左圖點一下 → 該 x 位置上所有色塊(整條垂直帶)複製到右側 · 拖曳平移 · 滾輪縮放(左右同步)</span>
</div>

<div id="stage">
  <div class="side" id="left">
    <div class="tag">原始 SVG(可點選)</div>
    <div class="wrap" id="lwrap">
      <div id="host"></div>
      <div id="lshade" class="vshade"></div>
      <canvas id="cv"></canvas>
    </div>
  </div>
  <div class="side" id="right">
    <div class="tag">已複製的色塊</div>
    <div class="wrap" id="rwrap">
      <svg id="rsvg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="rshade" class="vshade"></div>
    </div>
  </div>
  <div id="drop">拖放或<b>&nbsp;上傳 SVG&nbsp;</b>開始</div>
</div>

<div id="flyer"></div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const dpr = Math.max(1, window.devicePixelRatio || 1);

const left = $("left"), right = $("right"), stage = $("stage");
const lwrap = $("lwrap"), rwrap = $("rwrap"), host = $("host"), rsvg = $("rsvg");
const cv = $("cv"), ctx = cv.getContext("2d"), flyer = $("flyer");
const xpos = $("xpos"), lshade = $("lshade"), rshade = $("rshade");

let lsvg = null;                 // parsed source <svg>
let vbW = 0, vbH = 0;            // viewBox size (user units)
let sourcePxW = 0, sourcePxH = 0;  // original SVG raster dimensions
let baseW = 0, baseH = 0;        // rendered size at zoom=1 (css px)
let view = { s: 1, tx: 0, ty: 0 };   // shared zoom/pan
let pts = [];                    // markers in base-css-px (local) coords
let copied = new Set();          // source rids already mirrored on the right
const GEOMS = "path,rect,circle,ellipse,polygon,polyline,line";

function setXPercent(localX) {
  if (!xpos) return;
  if (!baseW || !Number.isFinite(localX)) { xpos.textContent = "x: --%"; return; }
  const pct = Math.max(0, Math.min(100, (localX / baseW) * 100));
  xpos.textContent = `x: ${pct.toFixed(2)}%`;
}

function hexToRgb(hex) {
  const n = hex.replace("#", "");
  return { r: parseInt(n.slice(0, 2), 16), g: parseInt(n.slice(2, 4), 16), b: parseInt(n.slice(4, 6), 16) };
}
function clearShade() {
  for (const sh of [lshade, rshade]) { sh.style.display = "none"; sh.style.width = "0"; }
}
function applyShade(startPct, endPct, hex, alpha) {
  const from = Math.max(0, Math.min(100, Math.min(startPct, endPct)));
  const to = Math.max(0, Math.min(100, Math.max(startPct, endPct)));
  const a = Math.max(0, Math.min(1, alpha));
  const { r, g, b } = hexToRgb(hex);
  const rgba = `rgba(${r}, ${g}, ${b}, ${a})`;
  for (const sh of [lshade, rshade]) {
    sh.style.left = `${from}%`;
    sh.style.width = `${to - from}%`;
    sh.style.background = rgba;
    sh.style.display = "block";
  }
}

/* ---- horizon: first filled y (skyline) for every sampled x ---- */
function filledGeometryClone() {
  const clone = lsvg.cloneNode(true);
  const originals = [...lsvg.querySelectorAll(GEOMS)];
  const copies = [...clone.querySelectorAll(GEOMS)];
  originals.forEach((el, i) => {
    const copy = copies[i], cs = getComputedStyle(el);
    const hidden = cs.fill === "none" || Number(cs.fillOpacity) === 0 || Number(cs.opacity) === 0 ||
      cs.display === "none" || cs.visibility === "hidden";
    if (hidden) { copy.setAttribute("display", "none"); return; }
    copy.setAttribute("fill", cs.fill);
    copy.setAttribute("fill-opacity", cs.fillOpacity);
    copy.setAttribute("fill-rule", cs.fillRule);
    copy.setAttribute("stroke", "none");
    copy.setAttribute("opacity", cs.opacity);
  });
  clone.querySelectorAll("image,text").forEach(el => el.setAttribute("display", "none"));
  const box = lsvg.viewBox.baseVal;
  clone.setAttribute("width", sourcePxW);
  clone.setAttribute("height", sourcePxH);
  clone.setAttribute("viewBox", `${box.x} ${box.y} ${box.width} ${box.height}`);
  return clone;
}
async function horizonSamples() {
  const box = lsvg.viewBox.baseVal;
  // Sample every pixel of the source SVG, rather than every viewBox unit.
  const width = sourcePxW;
  const height = sourcePxH;
  const xml = new XMLSerializer().serializeToString(filledGeometryClone());
  const url = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml" }));
  let image;
  try {
    image = await new Promise((resolve, reject) => {
      const next = new Image();
      next.onload = () => resolve(next);
      next.onerror = () => reject(new Error("SVG rasterization failed"));
      next.src = url;
    });
  } finally {
    URL.revokeObjectURL(url);
  }
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const context = canvas.getContext("2d", { willReadFrequently: true });
  context.drawImage(image, 0, 0, width, height);
  const pixels = context.getImageData(0, 0, width, height).data;
  const points = [];
  for (let px = 0; px < width; px++) {
    let py = 0;
    while (py < height && pixels[(py * width + px) * 4 + 3] === 0) py++;
    points.push({
      x: box.x + ((px + 0.5) / width) * box.width,
      y: py === height ? null : box.y + ((py + 0.5) / height) * box.height
    });
  }
  return { box, points, sampleWidth: width, sampleHeight: height };
}
function normalized(value, minimum, maximum) {
  if (!Number.isFinite(value)) return "";
  if (maximum === minimum) return "0";
  return (((value - minimum) / (maximum - minimum)) * 100).toFixed(6);
}
function horizonCsv(points, xScale, yScale) {
  const projected = points.map(point => ({
    point,
    x: xScale(point.x),
    y: Number.isFinite(point.y) ? yScale(point.y) : null
  }));
  const definedY = projected.map(point => point.y).filter(Number.isFinite);
  const xValues = projected.map(point => point.x);
  const minX = Math.min(...xValues), maxX = Math.max(...xValues);
  const minY = Math.min(...definedY), maxY = Math.max(...definedY);
  const rows = ["x,y,x_normalized,y_normalized"];
  for (const { point, x, y } of projected) {
    rows.push([point.x, point.y ?? "", normalized(x, minX, maxX), normalized(y, minY, maxY)].join(","));
  }
  return rows.join("\n");
}
function downloadHorizonCsv(points, scales) {
  const url = URL.createObjectURL(new Blob([horizonCsv(points, scales.x, scales.y)], { type: "text/csv;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "horizon.csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}
function renderHorizonPlot({ box, points }) {
  const root = $("horizon-chart");
  const margin = { top: 20, right: 22, bottom: 46, left: 62 };
  const availableW = Math.max(320, Math.min(820, root.clientWidth || 720)) - margin.left - margin.right;
  const maxInnerH = 520;
  let innerW = availableW;
  let innerH = innerW * box.height / box.width;
  if (innerH > maxInnerH) { innerH = maxInnerH; innerW = innerH * box.width / box.height; }
  const width = innerW + margin.left + margin.right, height = innerH + margin.top + margin.bottom;
  const x = d3.scaleLinear().domain([box.x, box.x + box.width]).range([0, innerW]);
  // SVG coordinates increase downward, so use the same direction in the chart.
  const y = d3.scaleLinear().domain([box.y, box.y + box.height]).range([0, innerH]);
  const sourceUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(new XMLSerializer().serializeToString(lsvg))}`;
  const svg = d3.select(root).append("svg").attr("viewBox", `0 0 ${width} ${height}`)
    .attr("width", "100%").attr("role", "img").attr("aria-label", "Skyline over source SVG");
  const plot = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
  plot.append("image").attr("class", "horizon-source").attr("href", sourceUrl)
    .attr("x", 0).attr("y", 0).attr("width", innerW).attr("height", innerH)
    .attr("preserveAspectRatio", "none");
  plot.append("g").attr("transform", `translate(0,${innerH})`).call(d3.axisBottom(x).ticks(8));
  plot.append("g").call(d3.axisLeft(y).ticks(6));
  plot.append("text").attr("x", innerW / 2).attr("y", innerH + 38).attr("fill", "#8b98a8")
    .attr("text-anchor", "middle").text("x (SVG units)");
  plot.append("text").attr("transform", "rotate(-90)").attr("x", -innerH / 2).attr("y", -46).attr("fill", "#8b98a8")
    .attr("text-anchor", "middle").text("skyline y (first filled pixel)");
  plot.append("path").datum(points).attr("fill", "none").attr("stroke", "#ff5d73").attr("stroke-width", 2.5)
    .attr("d", d3.line().defined(d => d.y !== null).x(d => x(d.x)).y(d => y(d.y)).curve(d3.curveStepAfter));

  const marker = plot.append("circle").attr("class", "horizon-hover-marker")
    .attr("r", 4).attr("fill", "#fff").attr("stroke", "#ff5d73").attr("stroke-width", 2)
    .style("display", "none").style("pointer-events", "none");
  const tooltip = plot.append("g").attr("class", "horizon-point-tooltip")
    .attr("aria-hidden", "true").style("display", "none").style("pointer-events", "none");
  tooltip.append("rect").attr("width", 172).attr("height", 54).attr("rx", 5)
    .attr("fill", "rgba(15,18,22,.94)").attr("stroke", "#8b98a8");
  const pointText = tooltip.append("text").attr("x", 8).attr("y", 19).attr("fill", "#e6edf3")
    .attr("font-size", 12).attr("font-family", "system-ui, sans-serif");
  const valueText = tooltip.append("text").attr("x", 8).attr("y", 38).attr("fill", "#4dd0e1")
    .attr("font-size", 12).attr("font-family", "system-ui, sans-serif");
  const formatValue = d3.format(".6f");
  const nearestPoint = d3.bisector(d => d.x).center;

  function showPoint(event) {
    const [pointerX] = d3.pointer(event, plot.node());
    const clampedX = Math.max(0, Math.min(innerW, pointerX));
    const index = nearestPoint(points, x.invert(clampedX));
    const point = points[index];
    const pointX = x(point.x);
    const hasY = Number.isFinite(point.y);
    const pointY = hasY ? y(point.y) : 0;
    const labelX = Math.max(0, Math.min(innerW - 172, pointX + 10));
    const labelY = Math.max(0, Math.min(innerH - 54, (hasY ? pointY : 0) + 10));

    tooltip.attr("transform", `translate(${labelX},${labelY})`).attr("data-index", index)
      .attr("data-x", point.x).attr("data-y", point.y ?? "")
      .style("display", null);
    pointText.text(`point ${index + 1}/${points.length}`);
    valueText.text(`x: ${formatValue(point.x)}  y: ${hasY ? formatValue(point.y) : "no filled pixel"}`);
    marker.attr("cx", pointX).attr("cy", pointY).style("display", hasY ? null : "none");
  }

  plot.append("rect").attr("class", "horizon-hover-area")
    .attr("x", 0).attr("y", 0).attr("width", innerW).attr("height", innerH)
    .attr("fill", "transparent").style("cursor", "crosshair")
    .on("pointermove", showPoint)
    .on("pointerleave", () => { tooltip.style("display", "none"); marker.style("display", "none"); });
  return { x, y };
}

/* ---- load ---- */
function loadSvgText(text) {
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const svg = doc.querySelector("svg");
  if (!svg || doc.querySelector("parsererror")) { alert("不是有效的 SVG"); return; }

  let vb = svg.getAttribute("viewBox");
  if (vb) { const p = vb.split(/[\s,]+/).map(Number); vbW = p[2]; vbH = p[3]; }
  else { vbW = parseFloat(svg.getAttribute("width")) || 300;
         vbH = parseFloat(svg.getAttribute("height")) || 300; vb = `0 0 ${vbW} ${vbH}`; }
  sourcePxW = Math.max(1, Math.ceil(parseFloat(svg.getAttribute("width")) || vbW));
  sourcePxH = Math.max(1, Math.ceil(parseFloat(svg.getAttribute("height")) || vbH));

  host.innerHTML = "";
  lsvg = document.importNode(svg, true);
  lsvg.removeAttribute("width"); lsvg.removeAttribute("height");
  lsvg.setAttribute("viewBox", vb);
  host.appendChild(lsvg);
  lsvg.querySelectorAll(GEOMS).forEach((el, i) => el.dataset.rid = i);

  rsvg.innerHTML = "";
  rsvg.setAttribute("viewBox", vb);

  pts = []; copied.clear();
  clearShade();
  setXPercent(NaN);
  stage.classList.add("loaded"); $("drop").style.display = "none";
  fitView();
}

/* ---- layout / view ---- */
function computeBase() {
  const pw = left.clientWidth, ph = left.clientHeight;
  const s0 = Math.min(pw / vbW, ph / vbH) * 0.94;
  baseW = vbW * s0; baseH = vbH * s0;

  lwrap.style.width = baseW + "px"; lwrap.style.height = baseH + "px";
  rwrap.style.width = baseW + "px"; rwrap.style.height = baseH + "px";
  for (const svg of [lsvg, rsvg]) if (svg) { svg.style.width = baseW + "px"; svg.style.height = baseH + "px"; }
  cv.style.width = baseW + "px"; cv.style.height = baseH + "px";
  cv.width = Math.round(baseW * dpr); cv.height = Math.round(baseH * dpr);
}
function fitView() {
  if (!lsvg) return;
  computeBase();
  const pw = left.clientWidth, ph = left.clientHeight;
  view.s = 1; view.tx = (pw - baseW) / 2; view.ty = (ph - baseH) / 2;
  applyView(); redraw();
}
function applyView() {
  const t = `translate(${view.tx}px,${view.ty}px) scale(${view.s})`;
  lwrap.style.transform = t; rwrap.style.transform = t;
  redraw();
}

/* ---- markers ---- */
function redraw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, baseW, baseH);
  const r = 6 / view.s, ring = 9 / view.s, lw = 2 / view.s;
  for (const p of pts) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
    ctx.fillStyle = p.hit ? "rgba(77,208,225,.95)" : "rgba(255,93,115,.95)"; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, ring, 0, 7);
    ctx.lineWidth = lw; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.stroke();
  }
}

/* ---- hit test: every filled shape whose horizontal (x) range contains the clicked x ----
   i.e. the whole VERTICAL strip/column under the click.
   (screen-space, transform-agnostic — the shared zoom/pan applies to all shapes equally) */
function hitTestVertical(clientX) {
  const els = lsvg.querySelectorAll(GEOMS);
  const hits = [];
  for (const el of els) {
    const cs = getComputedStyle(el);
    if (cs.fill === "none" || cs.display === "none" || cs.visibility === "hidden") continue;
    let box; try { box = screenBox(el); } catch (_) { continue; }
    if (box.h <= 0 && box.w <= 0) continue;
    if (clientX >= box.x && clientX <= box.x + box.w) hits.push(el);   // x-interval contains the point
  }
  return hits;                                 // painting order preserved (bottom→top)
}

/* ---- copy with cross-panel fly animation ---- */
function screenBox(el) {                       // exact on-screen rect from bbox+CTM
  const b = el.getBBox(), m = el.getScreenCTM();
  const cs = [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]];
  let xs = [], ys = [];
  for (const [x, y] of cs) { const p = new DOMPoint(x, y).matrixTransform(m); xs.push(p.x); ys.push(p.y); }
  return { x: Math.min(...xs), y: Math.min(...ys),
           w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys), bbox: b };
}
function styledClone(el) {
  const c = el.cloneNode(true);
  const cs = getComputedStyle(el);
  ["fill", "fill-rule", "fill-opacity", "stroke", "stroke-width", "stroke-linejoin", "opacity"]
    .forEach(k => c.setAttribute(k, cs.getPropertyValue(k)));
  return c;
}
function copyRegion(el) {
  const box = screenBox(el);
  const fly = document.createElementNS(NS, "svg");
  fly.setAttribute("viewBox", `${box.bbox.x} ${box.bbox.y} ${box.bbox.width} ${box.bbox.height}`);
  fly.setAttribute("preserveAspectRatio", "none");
  fly.style.cssText = `position:fixed;left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px;overflow:visible;`;
  fly.appendChild(styledClone(el));
  flyer.appendChild(fly);

  const lr = lwrap.getBoundingClientRect(), rr = rwrap.getBoundingClientRect();
  const dx = rr.left - lr.left, dy = rr.top - lr.top;
  const anim = fly.animate(
    [{ transform: "translate(0,0) scale(1)", opacity: 1 },
     { transform: `translate(${dx * 0.5}px,${dy * 0.5}px) scale(1.18)`, opacity: 1, offset: 0.5 },
     { transform: `translate(${dx}px,${dy}px) scale(1)`, opacity: 1 }],
    { duration: 650, easing: "cubic-bezier(.4,1.2,.5,1)" });

  const commit = () => {
    fly.remove();
    if (!copied.has(el.dataset.rid)) { rsvg.appendChild(styledClone(el)); copied.add(el.dataset.rid); }
  };
  anim.onfinish = commit; anim.oncancel = commit;
}

/* ---- pointer: click = place+hit, drag = pan (both sides), wheel = zoom (synced) ---- */
let down = null;
function localPt(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) / view.s, y: (clientY - r.top) / view.s };
}
function onDown(e, side) {
  if (e.button !== 0) return;
  down = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, moved: false, side };
}
window.addEventListener("mousemove", e => {
  if (!down) return;
  const ddx = e.clientX - down.x, ddy = e.clientY - down.y;
  if (!down.moved && Math.hypot(ddx, ddy) > 4) { down.moved = true; down.side.classList.add("panning"); }
  if (down.moved) { view.tx = down.tx + ddx; view.ty = down.ty + ddy; applyView(); }
});
window.addEventListener("mouseup", e => {
  if (!down) return;
  const d = down; down = null; d.side.classList.remove("panning");
  if (d.moved || !lsvg) return;
  if (d.side.id === "left") {                       // a click on the source
    const lp = localPt(e.clientX, e.clientY);
    setXPercent(lp.x);
    const hits = hitTestVertical(e.clientX);        // every color block crossing this x (vertical strip)
    pts.push({ x: lp.x, y: lp.y, hit: hits.length > 0 }); redraw();
    for (const el of hits) copyRegion(el);
  }
});
function onWheel(e, side) {
  if (!lsvg) return;
  e.preventDefault();
  const r = side.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;   // panel-local (same basis both sides)
  const f = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.min(40, Math.max(0.1, view.s * f));
  const k = ns / view.s;
  view.tx = cx - (cx - view.tx) * k; view.ty = cy - (cy - view.ty) * k; view.s = ns;
  applyView();
}
for (const side of [left, right]) {
  side.addEventListener("mousedown", e => onDown(e, side));
  side.addEventListener("wheel", e => onWheel(e, side), { passive: false });
}

$("shade").onclick = async () => {
  if (!lsvg) { Swal.fire("請先載入 SVG"); return; }
  const result = await Swal.fire({
    title: "套用垂直色帶",
    html: `
      <input id="sw-start" class="swal2-input" type="number" min="0" max="100" step="0.01" placeholder="起點 X (%)">
      <input id="sw-end" class="swal2-input" type="number" min="0" max="100" step="0.01" placeholder="終點 X (%)">
      <div style="display:flex;gap:8px;align-items:center;justify-content:center;padding:0 1.25em 0.75em;">
        <input id="sw-color" type="color" value="#4dd0e1" style="width:100%;max-width:120px;height:40px;border:0;padding:0;background:none;">
        <input id="sw-alpha" class="swal2-input" type="number" min="0" max="1" step="0.01" value="0.35" placeholder="Alpha 0~1" style="margin:0;max-width:120px;">
      </div>`,
    focusConfirm: false,
    showCancelButton: true,
    confirmButtonText: "套用",
    cancelButtonText: "取消",
    preConfirm: () => {
      const start = Number($("sw-start").value);
      const end = Number($("sw-end").value);
      const color = $("sw-color").value || "#4dd0e1";
      const alpha = Number($("sw-alpha").value);
      if (!Number.isFinite(start) || !Number.isFinite(end)) { Swal.showValidationMessage("請輸入有效的起點/終點百分比"); return; }
      if (start < 0 || start > 100 || end < 0 || end > 100) { Swal.showValidationMessage("X 百分比必須在 0~100"); return; }
      if (!Number.isFinite(alpha) || alpha < 0 || alpha > 1) { Swal.showValidationMessage("Alpha 必須在 0~1"); return; }
      return { start, end, color, alpha };
    }
  });
  if (result.isConfirmed) applyShade(result.value.start, result.value.end, result.value.color, result.value.alpha);
};
$("horizon").onclick = async () => {
  if (!lsvg) { Swal.fire("請先載入 SVG"); return; }
  const button = $("horizon");
  button.disabled = true; button.textContent = "Horizon…";
  try {
    const result = await horizonSamples();
    if (!result.points.some(point => point.y !== null)) { Swal.fire("找不到有填色的圖形"); return; }
    await Swal.fire({
      title: "Horizon",
      html: `<div class="hint" style="margin-bottom:10px;">每個 x 的最上方填色 y 值（${result.points.length} 個取樣點）</div><button id="download-horizon-csv" type="button">下載 CSV</button><div id="horizon-chart"></div>`,
      width: 900,
      didOpen: () => { const scales = renderHorizonPlot(result); $("download-horizon-csv").onclick = () => downloadHorizonCsv(result.points, scales); }
    });
  } catch (error) {
    console.error(error);
    Swal.fire("Horizon 圖表產生失敗");
  } finally {
    button.disabled = false; button.textContent = "Horizon";
  }
};
["dragover", "dragenter"].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add("dragover"); }));
["dragleave", "drop"].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); if (t === "dragleave" && e.target !== stage) return; stage.classList.remove("dragover"); }));
